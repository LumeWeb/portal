name: Build

on:
    workflow_call:

permissions:
    contents: read
    checks: write

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout Repo
                uses: actions/checkout@v7
                with:
                    submodules: true
            -   name: Setup Go
                uses: actions/setup-go@v7
                with:
                    go-version: 1.26.5
            -   name: Build
                run: |
                    go install go.lumeweb.com/xportal/cmd/xportal@latest
                    bash build.sh
            -   name: Run Tests
                uses: addnab/docker-run-action@v3
                with:
                    image: ghcr.io/lumeweb/portal-builder:ubuntu
                    options: -v ${{ github.workspace }}:/workspace -w /workspace
                    run: go test -v -race ./...
